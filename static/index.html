<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyPilot · Alexa+ simulator</title>
<style>
  :root { --ink:#16213a; --paper:#f4f6fb; --card:#fff; --line:#d9e0ee; --muted:#5a6785;
          --hi:#ffe14d; --blue:#2851d8; --red:#c62828; --redbg:#fdecea; --green:#1b7a43; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 "Segoe UI", system-ui, sans-serif; background:var(--paper); color:var(--ink); }
  header { padding:20px 24px 0; max-width:1100px; margin:0 auto; }
  h1 { font-size:1.6rem; margin:0; }
  h1 span { background:var(--hi); padding:0 6px; border-radius:6px; }
  .sub { color:var(--muted); margin:4px 0 0; }
  .layout { max-width:1100px; margin:0 auto; padding:16px 24px 24px; display:grid; grid-template-columns:1.2fr 1fr; gap:20px; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; padding:16px; } header { padding:16px 16px 0; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; min-height:520px; max-height:calc(100vh - 150px); }
  section h2 { font-size:1rem; margin:0; padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .scroll { flex:1; overflow-y:auto; padding:14px 16px; }
  #log { display:flex; flex-direction:column; gap:10px; }
  .msg { padding:10px 14px; border-radius:14px; max-width:90%; white-space:pre-wrap; }
  .you { align-self:flex-end; background:var(--blue); color:#fff; }
  .bot { align-self:flex-start; background:var(--paper); border:1px solid var(--line); }
  .bot.err { background:var(--redbg); border-color:#f3b8b3; }
  .dots span { display:inline-block; width:7px; height:7px; margin-right:4px; border-radius:50%; background:var(--muted); animation:b 1s infinite; }
  .dots span:nth-child(2) { animation-delay:.15s; } .dots span:nth-child(3) { animation-delay:.3s; }
  @keyframes b { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:10px 16px 0; }
  .chips button { background:var(--card); color:var(--ink); border:1px solid var(--line); padding:6px 12px; font-size:.88rem; border-radius:999px; }
  .chips button:hover { background:var(--hi); }
  form { display:flex; gap:8px; padding:12px 16px 16px; }
  input { flex:1; min-width:0; padding:12px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  button { border:0; border-radius:10px; background:var(--ink); color:#fff; font:inherit; cursor:pointer; padding:10px 16px; }
  button:disabled { opacity:.5; cursor:wait; }
  :focus-visible { outline:3px solid var(--hi); outline-offset:2px; }
  .stats { font-size:.82rem; font-weight:400; color:var(--muted); }
  .task { border:1px solid var(--line); border-left:5px solid var(--blue); border-radius:12px; padding:10px 12px; margin-bottom:10px; display:flex; gap:10px; align-items:center; }
  .task.overdue { border-left-color:var(--red); background:var(--redbg); }
  .task.today { border-left-color:var(--hi); }
  .task .info { flex:1; min-width:0; }
  .task .title { font-weight:600; }
  .task .meta { font-size:.85rem; color:var(--muted); }
  .badge { display:inline-block; font-size:.75rem; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--paper); margin-left:6px; }
  .overdue .badge { background:var(--red); color:#fff; }
  .today .badge { background:var(--hi); color:var(--ink); }
  .task button { background:var(--card); color:var(--green); border:1px solid var(--green); padding:5px 10px; font-size:.85rem; }
  .empty { color:var(--muted); text-align:center; padding:30px 10px; }
  dialog { border:1px solid var(--line); border-radius:16px; width:min(560px, 92vw); padding:20px; }
  dialog::backdrop { background:rgba(22,33,58,.45); }
  dialog h2 { border:0; padding:0; margin:0 0 4px; }
  textarea { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font:inherit; resize:vertical; }
  .dlgrow { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
  .ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .week { margin-top:8px; display:grid; gap:6px; min-width:260px; }
  .wrow { display:grid; grid-template-columns:78px 1fr 62px; gap:8px; align-items:center; font-size:.85rem; }
  .track { background:var(--line); border-radius:6px; height:10px; overflow:hidden; }
  .bar { height:100%; background:var(--blue); border-radius:6px; }
  .bar.over, .bar.late { background:var(--red); }
  .plan { margin-top:8px; display:grid; gap:6px; }
  .plan .task { margin:0; background:var(--card); }
</style>
</head>
<body>
<header>
  <h1>Study<span>Pilot</span></h1>
  <p class="sub">Simulated Alexa+ talking to the MCP server at <code>/mcp/</code></p>
</header>

<div class="layout">
  <section aria-label="Conversation">
    <h2>Talk to StudyPilot</h2>
    <div class="scroll"><div id="log" aria-live="polite"></div></div>
    <div class="chips">
      <button data-q="I fell behind, please fix my schedule">I fell behind</button>
      <button data-q="What should I study tonight? I have 2 hours.">What should I study tonight?</button>
      <button id="week">Week ahead</button>
      <button data-q="I can study 90 minutes a day, mostly in the evening">Set my study habits</button>
      <button data-q="plan 120">Plan 2 hours</button>
      <button id="syl">Import syllabus</button>
      <button id="demo">Load demo tasks</button>
    </div>
    <form id="f">
      <input id="q" autocomplete="off" aria-label="Message" placeholder="Try: I have a physics lab due Friday, about 45 minutes">
      <button id="send">Send</button>
    </form>
  </section>

  <section aria-label="Your tasks">
    <h2>Your tasks <span class="stats" id="stats"></span></h2>
    <div class="scroll" id="tasks"><div class="empty">No tasks yet.</div></div>
  </section>
</div>

<dialog id="dlg">
  <form method="dialog" id="dform">
    <h2>Import a syllabus</h2>
    <p class="meta">Paste your syllabus or list of assignments. StudyPilot finds the deadlines and adds them.</p>
    <textarea id="syltext" rows="9" aria-label="Syllabus text" placeholder="e.g. Quiz 1 on 5 Nov, Lab report due Nov 12, Final exam Dec 10..."></textarea>
    <div class="dlgrow"><button value="cancel" class="ghost">Cancel</button><button id="doimport" value="go">Import</button></div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const log = $("log"), form = $("f"), input = $("q"), sendBtn = $("send");

// ---------- dates (browser-local) ----------
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const inDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const daysUntil = s => Math.round((new Date(s + "T00:00") - new Date(iso(new Date()) + "T00:00")) / 864e5);

// ---------- MCP call over Streamable HTTP (JSON-RPC 2.0) ----------
async function callTool(name, args = {}) {
  const r = await fetch("/mcp/", { method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
    body: JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method: "tools/call", params: { name, arguments: args } }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  if (j.result.isError) throw new Error(j.result.content?.[0]?.text || "Tool error");
  return j.result.structuredContent?.result ?? j.result.structuredContent ?? JSON.parse(j.result.content[0].text);
}

// ---------- rendering (textContent only, so task text can't inject HTML) ----------
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function taskCard(t, withDone = true) {
  const n = daysUntil(t.due_date);
  const card = el("div", "task" + (n < 0 ? " overdue" : n === 0 ? " today" : ""));
  const info = el("div", "info");
  const title = el("div", "title", t.title);
  const label = n < 0 ? `${-n}d overdue` : n === 0 ? "due today" : n === 1 ? "due tomorrow" : `due in ${n}d`;
  title.append(el("span", "badge", label));
  info.append(title, el("div", "meta", `${t.subject} · ${t.due_date} · ${t.est_minutes} min`));
  card.append(info);
  if (withDone) {
    const b = el("button", null, "Done");
    b.onclick = async () => { b.disabled = true; try { await callTool("complete_task", { task_id: t.id }); } catch (e) { say(e.message, "bot err"); } refresh(); };
    card.append(b);
  }
  return card;
}

async function refresh() {
  try {
    const tasks = await callTool("list_tasks");
    const box = $("tasks"); box.replaceChildren();
    if (!tasks.length) { box.append(el("div", "empty", "No tasks yet. Add one, or click “Load demo tasks”.")); $("stats").textContent = ""; return; }
    tasks.forEach(t => box.append(taskCard(t)));
    const od = tasks.filter(t => daysUntil(t.due_date) < 0).length;
    $("stats").textContent = `${tasks.length} open · ${tasks.reduce((s, t) => s + t.est_minutes, 0)} min` + (od ? ` · ${od} overdue` : "");
  } catch (e) { $("tasks").replaceChildren(el("div", "empty", "Couldn't load tasks: " + e.message)); }
}

function say(text, cls) { const d = el("div", "msg " + cls, text); log.append(d); d.scrollIntoView({ block: "end" }); return d; }
function thinking() { const d = el("div", "msg bot dots"); d.append(el("span"), el("span"), el("span")); log.append(d); d.scrollIntoView({ block: "end" }); return d; }

function planBubble(p) {
  const d = el("div", "msg bot", `Plan for ${p.date} · ${p.minutes_planned} min`);
  const wrap = el("div", "plan"); p.plan.forEach(t => wrap.append(taskCard(t, false))); d.append(wrap);
  if (p.not_fitting_today.length) d.append(el("div", "meta", "Won't fit today: " + p.not_fitting_today.join(", ")));
  log.append(d); d.scrollIntoView({ block: "end" });
}

function weekBubble(w) {
  const d = el("div", "msg bot", `Week ahead · goal ${w.daily_minutes} min/day`);
  const max = Math.max(w.daily_minutes, w.overdue.minutes, ...w.days.map(x => x.minutes), 1);
  const rows = el("div", "week");
  const row = (label, mins, cls) => {
    const r = el("div", "wrow"), track = el("div", "track"), bar = el("div", "bar " + cls);
    bar.style.width = (mins / max * 100) + "%"; track.append(bar);
    r.append(el("span", null, label), track, el("span", null, mins + " min")); rows.append(r);
  };
  if (w.overdue.count) row("Overdue", w.overdue.minutes, "late");
  w.days.forEach(x => row(x.label, x.minutes, x.status === "overloaded" ? "over" : ""));
  d.append(rows);
  w.warnings.forEach(t => d.append(el("div", "meta", "⚠ " + t)));
  log.append(d); d.scrollIntoView({ block: "end" });
}

// ---------- message handling ----------
async function handle(text) {
  const [cmd, ...rest] = text.trim().split(/\s+/); const arg = rest.join(" ");
  if (cmd === "plan" && /^\d*$/.test(arg)) {
    const p = await callTool("plan_day", arg ? { available_minutes: +arg } : {});
    return p.plan.length ? planBubble(p) : say("Nothing to plan. Add a task first.", "bot");
  }
  // Everything else: Amazon Bedrock picks and calls the MCP tools
  const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
  if (!r.ok) throw new Error("Chat service error (" + r.status + ")");
  say((await r.json()).reply, "bot");
}

async function send(text) {
  say(text, "you"); sendBtn.disabled = true;
  const wait = thinking();
  try { await handle(text); } catch (e) { say("Something went wrong: " + e.message, "bot err"); }
  wait.remove(); sendBtn.disabled = false; refresh();
}

form.onsubmit = e => { e.preventDefault(); const v = input.value.trim(); input.value = ""; if (v) send(v); };
document.querySelectorAll(".chips button[data-q]").forEach(b => b.onclick = () => send(b.dataset.q));

$("demo").onclick = async () => {
  const b = $("demo"); b.disabled = true;
  const demo = [["Integration homework", "Maths", -3, 90], ["Physics lab report", "Physics", -1, 45],
                ["Organic chem revision", "Chemistry", 2, 60], ["History essay outline", "History", 4, 75]];
  try { for (const [title, subject, d, m] of demo) await callTool("add_task", { title, subject, due_date: inDays(d), est_minutes: m }); }
  catch (e) { say("Couldn't load demo tasks: " + e.message, "bot err"); }
  b.disabled = false; refresh();
  say("Loaded 4 demo tasks, two of them overdue. Try “I fell behind, please fix my schedule.”", "bot");
};

$("week").onclick = async () => {
  say("How does my week look?", "you"); const wait = thinking();
  try { weekBubble(await callTool("weekly_overview")); } catch (e) { say("Something went wrong: " + e.message, "bot err"); }
  wait.remove();
};
$("syl").onclick = () => $("dlg").showModal();
$("dform").onsubmit = async e => {
  if (e.submitter?.value !== "go") return;
  const text = $("syltext").value.trim(); if (!text) return;
  $("syltext").value = ""; say("Import syllabus: " + text.slice(0, 90) + (text.length > 90 ? "…" : ""), "you");
  sendBtn.disabled = true; const wait = thinking();
  try {
    const r = await callTool("import_syllabus", { text });
    say(r.error ? r.error : `Found ${r.added} task${r.added === 1 ? "" : "s"}` + (r.skipped_duplicates ? ` (${r.skipped_duplicates} already on your list)` : "") + ".", r.error ? "bot err" : "bot");
  } catch (err) { say("Something went wrong: " + err.message, "bot err"); }
  wait.remove(); sendBtn.disabled = false; refresh();
};

say("Hi! I'm StudyPilot. Tell me what you need to study and when, and I'll plan your day.", "bot");
refresh();
</script>
</body>
</html>
